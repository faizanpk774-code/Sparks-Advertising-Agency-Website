<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="code-title code-description">
  <title id="code-title">Live Sparks website code</title>
  <desc id="code-description">A small code editor below the Sparks Advertising Agency logo, with code lines and a blinking cursor.</desc>
  <g class="code-window">
    <rect x="64" y="252" width="472" height="181" rx="3" fill="#151715" stroke="#f7941d" stroke-opacity=".62" stroke-width="1.5"/>
    <path d="M67 255H533V282H67Z" fill="#232521"/>
    <circle cx="83" cy="268" r="3" fill="#f7941d"/>
    <circle cx="96" cy="268" r="3" fill="#777970"/>
    <circle cx="109" cy="268" r="3" fill="#777970"/>
    <text class="code-label" x="128" y="271">SPARKS / LIVE CODE</text>
    <text class="code-status" x="471" y="271">BUILDING</text>
    <text class="code-number" x="91" y="313">01</text>
    <text class="code-number" x="91" y="341">02</text>
    <text class="code-number" x="91" y="369">03</text>
    <text class="code-number" x="91" y="397">04</text>
    <text class="code-row code-row-one" x="125" y="313"><tspan class="code-keyword">const</tspan><tspan> site = createPage();</tspan></text>
    <text class="code-row code-row-two" x="125" y="341"><tspan class="code-keyword">build</tspan><tspan>(brand);</tspan></text>
    <text class="code-row code-row-three" x="125" y="369"><tspan class="code-keyword">render</tspan><tspan>(services);</tspan></text>
    <text class="code-row code-row-four" x="125" y="397"><tspan class="code-keyword">launch</tspan><tspan>(sparks);</tspan></text>
    <rect class="typing-caret" x="311" y="385" width="5" height="16" rx="1"/>
  </g>
  <g class="website-preview">
    <rect x="356" y="288" width="174" height="68" rx="2" fill="#111311" stroke="#f7941d" stroke-opacity=".75"/>
    <path d="M358 290H528V301H358Z" fill="#2a2c28"/>
    <circle cx="365" cy="295" r="1.5" fill="#f7941d"/><circle cx="371" cy="295" r="1.5" fill="#8b8c83"/><circle cx="377" cy="295" r="1.5" fill="#8b8c83"/>
    <text class="preview-label" x="386" y="298" fill="#ddd9cf" font-family="Courier New, monospace" font-size="5" letter-spacing=".45">LIVE WEBSITE PREVIEW</text>
    <rect class="preview-hero" x="366" y="307" width="154" height="18" rx="1" fill="#f7941d"/>
    <rect class="preview-heading" x="372" y="312" width="54" height="2" fill="#fff4df"/>
    <rect class="preview-heading" x="372" y="317" width="38" height="1.5" fill="#fff4df" opacity=".8"/>
    <rect class="preview-card preview-card-one" x="366" y="330" width="46" height="18" fill="#30322d"/>
    <rect class="preview-card preview-card-two" x="417" y="330" width="46" height="18" fill="#30322d"/>
    <rect class="preview-card preview-card-three" x="468" y="330" width="52" height="18" fill="#30322d"/>
    <rect class="preview-card-line preview-card-line-one" x="372" y="335" width="28" height="2" fill="#f7941d"/>
    <rect class="preview-card-line preview-card-line-two" x="423" y="335" width="28" height="2" fill="#f7941d"/>
    <rect class="preview-card-line preview-card-line-three" x="474" y="335" width="32" height="2" fill="#f7941d"/>
  </g>
  <g class="coding-person">
    <path d="M477 349V365M517 349V365M477 350H517" fill="none" stroke="#777970" stroke-width="4"/>
    <circle cx="494" cy="306" r="12" fill="#d99a70"/>
    <path d="M482 304Q480 290 494 291Q508 292 507 306L501 302 495 298 490 304Z" fill="#292a27"/>
    <path d="M482 321Q495 313 507 321L516 353H475Z" fill="#f7941d"/>
    <path d="M484 326 469 340 456 350M505 326 518 340 524 351" fill="none" stroke="#d99a70" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M449 354H531L526 361H454Z" fill="#bdbbb2" stroke="#f7941d" stroke-width="1"/>
    <path d="M455 357H526" stroke="#565750" stroke-width="1"/>
    <path d="M481 359H505L512 377 531 389 526 395 501 386 489 375 478 390 456 394 453 388 473 377Z" fill="#292a27"/>
  </g>
</svg>
